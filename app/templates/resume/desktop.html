{% extends "layouts/base.html" %}

{% block css %}
  <link href="{{ assetsPath("assets/resume_desktop.bundle.css") }}" rel="stylesheet" type="text/css">
  {% if fromDownload %}
    <style>
      /* Flatten the share-page chrome for PDF export: no card shadow / outer margin. */
      html, body {
        background-color: #fff !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      #footer,
      #loading,
      #wechat-image {
        display: none !important;
      }
      #resume {
        margin: 0 !important;
        padding: 0 !important;
      }
      /* CSS-module class names are hashed; match by substring. */
      #resume [class*="desktop_container"],
      #resume [class*="mobile_container"] {
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
      }
      #resume [class*="container"],
      #resume [class*="wrapper"] {
        box-shadow: none !important;
        border-radius: 0 !important;
        height: auto !important;
        min-height: 0 !important;
      }
    </style>
  {% endif %}
{% endblock %}

{% block body %}
  <div id="loading">
    <div class="loading_container">
      <div class="ball-clip-rotate-multiple">
        <div></div>
        <div></div>
      </div>
    </div>
  </div>
  <div id="resume"></div>
{% endblock %}

{% block js %}
  <script>
    window.login = '{{ login }}';
    window.userId = '{{ userId }}';
    window.resumeHash = '{{ resumeHash }}';
    window.pinyin = '{{ pinyin }}';
    window.fromDownload = '{{ fromDownload }}';
  </script>
  <script async defer src="{{ assetsPath("assets/resume_desktop.bundle.js") }}"></script>
{% endblock %}
